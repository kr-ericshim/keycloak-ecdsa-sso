# 운영 구성: Caddy(HTTPS) → Keycloak(운영 모드, Postgres) / 서비스 A / 서비스 B
# 실행: docker compose -f deploy/compose.prod.yml --env-file deploy/production.env up -d --build
name: crypto-sso-prod

services:
  caddy:
    image: caddy:2.10-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      ACME_EMAIL: ${ACME_EMAIL}
      IDP_SITE: ${IDP_SITE}
      SIGN_SITE: ${SIGN_SITE}
      VERIFY_SITE: ${VERIFY_SITE}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      keycloak:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?production.env 에 POSTGRES_PASSWORD 가 필요합니다}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 20

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.2
    restart: unless-stopped
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      KC_HOSTNAME: ${KEYCLOAK_PUBLIC_URL:?production.env 에 KEYCLOAK_PUBLIC_URL 이 필요합니다}
      # 관리 콘솔은 SSH 터널(127.0.0.1:8080)로만 연다
      KC_HOSTNAME_ADMIN: http://localhost:8080
      KC_HTTP_ENABLED: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USERNAME:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?production.env 에 KC_ADMIN_PASSWORD 가 필요합니다}
      JAVA_OPTS_KC_HEAP: ${KC_HEAP_OPTS:--XX:MaxRAMPercentage=50}
      # realm JSON 안의 ${...} 치환값
      SERVICE_A_BASE_URL: ${SERVICE_A_BASE_URL}
      SERVICE_B_BASE_URL: ${SERVICE_B_BASE_URL}
      SERVICE_A_CLIENT_SECRET: ${SERVICE_A_CLIENT_SECRET}
      SERVICE_B_CLIENT_SECRET: ${SERVICE_B_CLIENT_SECRET}
      DEMO_ALICE_PASSWORD: ${DEMO_ALICE_PASSWORD:?production.env 에 DEMO_ALICE_PASSWORD 가 필요합니다}
      DEMO_BOB_PASSWORD: ${DEMO_BOB_PASSWORD:?production.env 에 DEMO_BOB_PASSWORD 가 필요합니다}
      SERVICE_A_BACKCHANNEL_LOGOUT_URL: http://service-a:3001/backchannel-logout
      SERVICE_B_BACKCHANNEL_LOGOUT_URL: http://service-b:3002/backchannel-logout
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../keycloak/realm-crypto-sso.json:/opt/keycloak/data/import/crypto-sso-realm.json:ro
      - ../keycloak/themes/crypto-sso:/opt/keycloak/themes/crypto-sso:ro
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-ec", "{ printf 'HEAD /health/ready HTTP/1.0\r\n\r\n' >&0; grep 'HTTP/1.0 200'; } 0<>/dev/tcp/localhost/9000"]
      interval: 5s
      timeout: 3s
      start_period: 120s
      retries: 40

  service-a:
    build:
      context: ..
      dockerfile: service-a/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3001"
      BASE_URL: ${SERVICE_A_BASE_URL}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: crypto-sso
      CLIENT_ID: service-a
      CLIENT_SECRET: ${SERVICE_A_CLIENT_SECRET}
      SESSION_SECRET: ${SERVICE_A_SESSION_SECRET}
      TRUST_PROXY: "1"
      PEER_URL: ${SERVICE_B_BASE_URL}
      DATA_DIR: /app/service-a/data
    volumes:
      - service-a-data:/app/service-a/data
    depends_on:
      keycloak:
        condition: service_healthy

  service-b:
    build:
      context: ..
      dockerfile: service-b/Dockerfile
    restart: unless-stopped
    environment:
      PORT: "3002"
      BASE_URL: ${SERVICE_B_BASE_URL}
      KEYCLOAK_PUBLIC_URL: ${KEYCLOAK_PUBLIC_URL}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_REALM: crypto-sso
      CLIENT_ID: service-b
      CLIENT_SECRET: ${SERVICE_B_CLIENT_SECRET}
      SESSION_SECRET: ${SERVICE_B_SESSION_SECRET}
      TRUST_PROXY: "1"
      PEER_URL: ${SERVICE_A_BASE_URL}
      ISSUER_KEY_URL: http://service-a:3001/api/issuer-key
      DATA_DIR: /app/service-b/data
    volumes:
      - service-b-data:/app/service-b/data
    depends_on:
      keycloak:
        condition: service_healthy
      service-a:
        condition: service_started

volumes:
  caddy-data:
  caddy-config:
  postgres-data:
  service-a-data:
  service-b-data:
